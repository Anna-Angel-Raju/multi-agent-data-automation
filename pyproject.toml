[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anna-Angel-Raju", email = "annaangelraju@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipython>=9.18.1",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.12",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
data-agent = "data_agent:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
